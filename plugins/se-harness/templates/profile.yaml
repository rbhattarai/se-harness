# .harness/profile.yaml — COMMITTED. Non-secret project profile (A5 #3).
# Secrets (tokens, credentialed URLs) belong in .env.harness (gitignored) — never here.
# Generated by /harness-init; refreshed by /harness-scan and /harness-sync.

project:
  name: ""
  type: existing            # new | existing
  topology: single          # single | mono-repo | modulith | multi-repo | hybrid
                             # (see workspace.yaml for every value except single)

methodology: openspec       # se-harness | openspec | spec-kit | bmad — inherited from
                             # workspace.yaml's shared.methodology when a workspace manifest
                             # exists (phase 3); a value that deviates from it should carry a
                             # trailing comment explaining why (a documented exception, not a
                             # silent one). "se-harness" displays as "se-harness (built-in)" —
                             # only it and openspec are actually delegated to by /harness-goal
                             # today — bmad/spec-kit install but don't change /harness-goal's
                             # own behavior yet (registry note).

stack:                      # detected by /harness-scan or chosen at init
  languages: []             # e.g. [typescript, java]
  frameworks: []            # e.g. [react, spring-boot]
  databases: []             # e.g. [postgres, redis]
  messaging: []             # e.g. [kafka]

devops:
  ci: ""                    # e.g. github-actions
  containers: docker-compose
cloud: ""                   # aws | azure | gcp | vercel — drives the deploy plugin choice

org:                        # organization context (A1 intake; compose-first, A5 #7)
  internal_libraries: []    # - { name: "@acme/ui", registry: "npm:@acme", purpose: "design-system components" }
  preferred_libraries: []   # - { use: "dayjs", never: "moment", reason: "org standard" }
  conventions_url: ""       # Confluence/SharePoint page holding org guidelines (wiki-ingest pulls it)
  conventions: []           # inline rules, e.g. "errors: never swallow; wrap in AppError"
  guardrails: []            # org policy on what the agent should/shouldn't help with, one rule per line; empty = no section.
                            # /harness-init lets you pick from templates/guardrails.preset.txt and/or write your own. A soft instruction, not enforcement.
  convention_docs: []       # written by /harness-conventions: - { area: "angular", path: ".harness/conventions/angular.md", applies_to: ["**/*.ts"], status: "confirmed", scope: "repo" }
                            # scope: "workspace" entries are inherited from workspace.yaml shared.org.convention_docs;
                            # their path is relative to THIS repo (e.g. ../.harness/conventions/lib-ui.md)

sources:                    # enterprise memory sources (tier-3 wiki ingestion) — inherited
                             # from workspace.yaml's shared.{jira_project,confluence_spaces,
                             # sharepoint_sites,nas_doc_paths,nas_video_paths} when a workspace
                             # manifest exists (phase 3). Recording a value here doesn't ingest
                             # anything by itself — /harness-mem-wiki does the actual synthesis,
                             # into the workspace-level wiki, not this repo's own.
  jira_project: ""
  confluence_spaces: []
  sharepoint_sites: []
  nas_doc_paths: []         # any document format (pdf/docx/pptx/xlsx/md/txt/…); /harness-mem-wiki walks these recursively
  nas_video_paths: []       # transcribed via Graphify's video extra, then wiki-ingested

memory:                     # tier-1 (structural) ONLY — phase 4. Tiers 2/3 are always plain
                             # markdown under .harness/memory/, regardless of this value.
  structural_driver: null   # one of registry/recommendations.json's memory.structural
                             # choose_one entries, or null (deferred — valid, not nagged).
                             # Inherited from workspace.yaml's shared.memory.structural_driver
                             # when a workspace manifest exists. Set by /harness-init Step 6;
                             # actually installed by /harness-bootstrap, never by init itself.
  codegraph:                # only meaningful when structural_driver is codegraph. See /harness-mem-codegraph.
    variant: null           # colbymchenry (codegraph CLI, .codegraph/ SQLite) | codegraph-ai (codegraph-server, RocksDB)
    telemetry: null         # on | off - colbymchenry/codegraph sends telemetry unless turned off; recorded, never assumed
  codebase_memory:          # only meaningful when structural_driver is codebase-memory-mcp. See /harness-mem-codebase-memory.
    index_mode: full        # full | moderate | fast  (cross-repo linking is offered separately, workspace only)
  sourcegraph:              # only meaningful when structural_driver is sourcegraph (remote MCP; nothing installed locally).
                             # Inherited from workspace.yaml's shared.memory.sourcegraph. No secrets here.
    deployment: null        # cloud (managed single-tenant instance) | self-hosted
    url: ""                 # https://sourcegraph.example.com  (instance root, no path, no token)
    endpoint: "/.api/mcp"   # /.api/mcp (search, navigation, history) | /.api/mcp/all (adds Deep Search)
    auth: oauth             # oauth (browser login, no secret) | token
    token_env: SOURCEGRAPH_ACCESS_TOKEN   # NAME of the env var in .env.harness; used only when auth: token
    repo_scope: ""          # optional repo-name prefix agents add to queries, e.g. "github.com/acme/"

observability:              # agent-session tracing (Langfuse / OpenTelemetry-style). A recorded DECISION,
                             # not just a plugin: `status` says what happens next.
  status: unset             # unset      never decided (also: projects made before this field existed)
                             # deferred   "not yet" - /harness-sync asks again
                             # declined   "no thanks" - never re-asked (change: --reconfigure observability)
                             # configured a provider is chosen
  provider: null            # langfuse | dash0 | other - meaningful once configured
  host: ""                  # NON-SECRET endpoint, e.g. http://localhost:3000 (self-hosted Langfuse).
                             # Keys and tokens are never here: .env.harness (workspace root when shared).
  decided: ""               # YYYY-MM-DD of the last decision
                             # Inherited from workspace.yaml's shared.observability when a workspace
                             # manifest exists. Set/changed by /harness-bootstrap [--reconfigure
                             # observability]; surfaced and re-asked (if deferred) by /harness-sync.
