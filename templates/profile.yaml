# .harness/profile.yaml — COMMITTED. Non-secret project profile (A5 #3).
# Secrets (tokens, credentialed URLs) belong in .env.harness (gitignored) — never here.
# Generated by /harness-init; refreshed by /harness-scan and /harness-sync.

project:
  name: ""
  type: existing            # new | existing
  topology: single          # single | mono-repo | modulith | multi-repo | hybrid
                             # (see workspace.yaml for every value except single)

methodology: openspec       # bmad | spec-kit | openspec | se-harness — inherited from
                             # workspace.yaml's shared.methodology when a workspace manifest
                             # exists (phase 3); a value that deviates from it should carry a
                             # trailing comment explaining why (a documented exception, not a
                             # silent one). "se-harness" displays as "se-harness (built-in)" —
                             # only it and openspec are actually delegated to by /harness-goal
                             # today — bmad/spec-kit install but don't change /harness-goal's
                             # own behavior yet (registry note).

stack:                      # detected by /harness-scan or chosen at init
  languages: []             # e.g. [typescript, java]
  frameworks: []            # e.g. [react, spring-boot]
  databases: []             # e.g. [postgres, redis]
  messaging: []             # e.g. [kafka]

devops:
  ci: ""                    # e.g. github-actions
  containers: docker-compose
cloud: ""                   # aws | azure | gcp | vercel — drives the deploy plugin choice

org:                        # organization context (A1 intake; compose-first, A5 #7)
  internal_libraries: []    # - { name: "@acme/ui", registry: "npm:@acme", purpose: "design-system components" }
  preferred_libraries: []   # - { use: "dayjs", never: "moment", reason: "org standard" }
  conventions_url: ""       # Confluence/SharePoint page holding org guidelines (wiki-ingest pulls it)
  conventions: []           # inline rules, e.g. "errors: never swallow; wrap in AppError"

sources:                    # enterprise memory sources (tier-3 wiki ingestion) — inherited
                             # from workspace.yaml's shared.{jira_project,confluence_spaces,
                             # sharepoint_sites,nas_doc_paths,nas_video_paths} when a workspace
                             # manifest exists (phase 3). Recording a value here doesn't ingest
                             # anything by itself — /harness-mem-wiki does the actual synthesis,
                             # into the workspace-level wiki, not this repo's own.
  jira_project: ""
  confluence_spaces: []
  sharepoint_sites: []
  nas_doc_paths: []         # PDFs/Office docs; /harness-mem-wiki walks these recursively
  nas_video_paths: []       # transcribed via Graphify's video extra, then wiki-ingested

memory:                     # tier-1 (structural) ONLY — phase 4. Tiers 2/3 are always plain
                             # markdown under .harness/memory/, regardless of this value.
  structural_driver: null   # one of registry/recommendations.json's memory.structural
                             # choose_one entries, or null (deferred — valid, not nagged).
                             # Inherited from workspace.yaml's shared.memory.structural_driver
                             # when a workspace manifest exists. Set by /harness-init Step 6;
                             # actually installed by /harness-bootstrap, never by init itself.
